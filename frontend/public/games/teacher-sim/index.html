<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | SDGP Teacher Role</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /* Ensure the canvas fills the iframe perfectly without scrollbars */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-container { width: 100%; height: 100%; position: relative; }
    #unity-canvas { width: 100% !important; height: 100% !important; display: block; }
    #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <p style="color: white; text-align: center; font-family: sans-serif; margin-top: 10px;">Loading Simulation...</p>
    </div>
    <div id="unity-warning"> </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Teachim_V3.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Teachim_V3.data",
      frameworkUrl: buildUrl + "/Teachim_V3.framework.js",
      codeUrl: buildUrl + "/Teachim_V3.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "SDGP Teacher Role",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        // --- CRITICAL ADDITION ---
        // Save the instance to the window so React can call unityInstance.SendMessage()
        window.unityInstance = unityInstance;
        
        document.querySelector("#unity-loading-bar").style.display = "none";
        
        // Ensure standard fullscreen button still works if present in template
        const fsBtn = document.querySelector("#unity-fullscreen-button");
        if(fsBtn) {
            fsBtn.onclick = () => { unityInstance.SetFullscreen(1); };
        }

      }).catch((message) => {
        console.error("Unity Initialization Error:", message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
